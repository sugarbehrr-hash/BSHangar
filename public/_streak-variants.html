<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#d9d2c4;font-family:system-ui,sans-serif;padding:30px;color:#0F1E3D}
  .row{display:flex;gap:24px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
  .card{background:#FBF7EE;border:1px solid #ECE3CF;border-radius:16px;padding:18px;width:270px}
  .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8a8172;margin-bottom:8px}
  .desc{font-size:12px;color:#5E6C7A;margin-top:8px;line-height:1.4}
  svg{display:block;background:#fff;border-radius:8px}
</style></head>
<body><div class="row" id="root"></div>
<script>
const RAMP = ['#0F1E3D','#1B3461','#294B82','#3B8BD6','#9FD0F0']; // inner->outer
const BW = 15;
function svg(inner){return `<svg width="234" height="234" viewBox="0 0 256 256"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${BW}">${inner}</g></svg>`;}

// A — L-hook, convex bottom-right (CURRENT). horizontal base -> quarter turn -> vertical fan up-right
function A(){
  const Ccx=110,Ccy=96,topY=26,leftX=24,radii=[34,52,70,88,106];let p='';
  radii.forEach((r,i)=>{p+=`<path d="M${leftX} ${Ccy+r} L${Ccx} ${Ccy+r} A${r} ${r} 0 0 1 ${Ccx+r} ${Ccy} L${Ccx+r} ${topY}" stroke="${RAMP[i]}"/>`;});
  return svg(p);
}
// B — smooth convex swoosh (bezier), bulges bottom-right, no straight L
function B(){
  let p='';[0,1,2,3,4].forEach(k=>{const o=k*17;
    p+=`<path d="M24 ${118+o} Q ${150+o*0.2} ${118+o} ${196+o} 34" stroke="${RAMP[k]}"/>`;});
  return svg(p);
}
// C — convex TOP-LEFT: rises early then arcs over (breaking-wave / hill), fan points up
function C(){
  let p='';[0,1,2,3,4].forEach(k=>{const o=k*17;
    // start horizontal low-left, curve UP so the leading (upper) edge bulges out
    p+=`<path d="M24 ${150+o} Q ${120} ${150+o} ${150+o*0.15} ${70-o*0.1} Q ${172+o*0.3} ${34} ${210+o} ${34}" stroke="${RAMP[k]}"/>`;});
  return svg(p);
}
// D — horizontal mirror of A: base bottom-right, fan up-left
function D(){return `<div style="transform:scaleX(-1)">${A()}</div>`;}

const items=[
  ['Variant A','current — L-hook, convex bottom-right',A()],
  ['Variant B','smooth swoosh, convex bottom-right',B()],
  ['Variant C','convex top-left (curls up & over)',C()],
  ['Variant D','A mirrored — fan on the upper-left',D()],
];
document.getElementById('root').innerHTML = items.map(([l,d,s])=>`<div class="card"><div class="lbl">${l}</div>${s}<div class="desc">${d}</div></div>`).join('');
</script></body></html>
