<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox redesign — lab v3</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/contract/_assets/tokens/fonts.css">
<link rel="stylesheet" href="/contract/_assets/tokens/colors.css">
<link rel="stylesheet" href="/contract/_assets/tokens/typography.css">
<link rel="stylesheet" href="/contract/_assets/tokens/spacing.css">
<link rel="stylesheet" href="/contract/_assets/tokens/effects.css">
<style>
/**
 * Prototype v3 — fixture data, no Firebase.
 *
 * v2 read as one merged column doing two jobs (read the card, review the
 * feedback) and buried the headline number in a sentence. v3: the workflow is
 * left to right — pick a card (navigator), read what it actually says
 * (document), see how many people struggled and read why (stats + comments).
 * Three real columns, each scrolling independently, so switching cards never
 * re-scrolls the navigator and reading a long comment thread never scrolls
 * the card text out of view.
 *
 * The stat block follows the dataviz skill's status-pair pattern: a colored
 * hero number paired with a text label (never color alone), plus a compact
 * part-to-whole bar — 2px surface gap between segments, rounded ends via
 * overflow:hidden on the wrapper, no stroke drawn to separate them.
 *
 * Component classes hand-copied from src/styles/system.css, as in v1/v2.
 */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream-200); font-family: var(--font-body); color: var(--ink-900); }
.lab-banner { background: #1f2a44; color: #fff; font-family: var(--font-heading); font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; text-align: center; padding: 7px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-pill); font-family: var(--font-heading); font-weight: 800; font-size: 0.875rem; cursor: pointer; border: 1.5px solid transparent; background: var(--white); }
.btn.quiet { background: var(--white); border-color: var(--cream-300); color: var(--navy-900); }
.btn.sm { min-height: 36px; padding: 0 13px; font-size: 0.8125rem; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--gold-100); }
.notice .nt { font-size: 0.84375rem; line-height: 1.5; color: var(--ink-900); }
.link { border: 0; background: none; font-family: var(--font-heading); font-weight: 800; font-size: 0.8125rem; color: var(--sky-700); text-decoration: underline; cursor: pointer; padding: 0; min-height: 40px; display: inline-flex; align-items: center; }

/* ---- app shell ---- */
.shell { height: 100vh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--cream-300); background: var(--white); flex: none; }
.topbar-title { font-family: var(--font-heading); font-weight: 800; font-size: 1rem; color: var(--navy-900); margin: 0; }
.topbar-kicker { font-family: var(--font-heading); font-weight: 700; font-size: 0.6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-500); margin: 0; }

.panes { flex: 1; min-height: 0; display: flex; }

/* ---- column 1: navigator (filter + sections + list, ONE column) ---- */
.nav-pane { width: 330px; flex: none; border-right: 1px solid var(--cream-300); background: var(--white); display: flex; flex-direction: column; min-height: 0; }
.nav-head { flex: none; padding: 12px 14px; border-bottom: 1px solid var(--cream-300); display: grid; gap: 10px; }
.seg { display: flex; gap: 6px; background: var(--cream-100); border-radius: var(--radius-pill); padding: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: var(--radius-pill); padding: 7px 10px; font-family: var(--font-heading); font-weight: 800; font-size: 0.78125rem; color: var(--ink-500); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--navy-900); box-shadow: var(--shadow-sm); }
/* Section picker — a single-line dropdown instead of a chip row that wraps
   and eats vertical space in the navigator header. */
.sectionpick { position: relative; }
.sectionpick select {
  appearance: none; -webkit-appearance: none;
  width: 100%; min-height: 40px; padding: 0 32px 0 12px;
  border: 1.5px solid var(--cream-300); border-radius: var(--radius-sm);
  background: var(--white);
  font-family: var(--font-heading); font-weight: 800; font-size: 0.84375rem; color: var(--navy-900);
  cursor: pointer;
}
.sectionpick select:focus { outline: none; border-color: var(--navy-700); }
.sectionpick::after {
  content: ''; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px;
  border-right: 2px solid var(--ink-500); border-bottom: 2px solid var(--ink-500);
  transform: translateY(-65%) rotate(45deg); pointer-events: none;
}

.nav-scroll { flex: 1; overflow-y: auto; }
.group-head { font-family: var(--font-heading); font-weight: 800; font-size: 0.6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); padding: 12px 14px 4px; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--cream-300); background: var(--white); padding: 10px 14px; cursor: pointer; }
.row:hover { background: var(--cream-100); }
.row[aria-current="true"] { background: var(--sky-100); }
.row-title { font-family: var(--font-heading); font-weight: 700; font-size: 0.84375rem; color: var(--navy-900); line-height: 1.3; }
.row.settled .row-title { font-weight: 600; color: var(--ink-700); }
.row-badges { display: flex; gap: 6px; margin-top: 6px; }
.stat-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 0.6875rem; font-weight: 800; font-family: var(--font-heading); }
.stat-pill.warn { background: var(--gold-100); color: var(--gold-600, #8a5a00); }
.stat-pill.good { background: var(--success-100, #dff3e6); color: var(--success-700, #1A7546); }
.stat-pill.quiet { background: var(--cream-100); color: var(--ink-500); }
.empty-list { padding: 30px 16px; text-align: center; color: var(--ink-500); font-size: 0.875rem; }

/* ---- columns 2 + 3: only exist once something is selected ---- */
.workspace { flex: 1; min-width: 0; display: flex; }
.workspace-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-500); font-size: 0.9375rem; padding: 40px; }

/* column 2: the document — reading only, no review chrome */
.doc-pane { flex: 1 1 50%; min-width: 0; overflow-y: auto; border-right: 1px solid var(--cream-300); }
.doc-inner { max-width: 560px; padding: 26px 28px 60px; }
.d-title { font-family: var(--font-heading); font-weight: 800; font-size: 1.375rem; color: var(--navy-900); margin: 0; }
.d-topic { font-family: var(--font-heading); font-weight: 700; font-size: 0.75rem; color: var(--ink-500); margin: 3px 0 0; }
.d-body { margin-top: 16px; border-radius: var(--radius-sm); background: var(--cream-100); padding: 16px; }
.d-tp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.d-tp-label { font-family: var(--font-heading); font-weight: 800; font-size: 0.6875rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 3px; }
.d-tp-label.today { color: var(--ink-500); }
.d-tp-label.proposed { color: var(--navy-700); }
.d-tp p { margin: 0; font-size: 0.8125rem; line-height: 1.5; color: var(--ink-700); }
.d-plain { margin: 12px 0 0; font-size: 0.9375rem; line-height: 1.55; color: var(--ink-900); }

/* column 3: stats + comments — the review workspace */
.review-pane { flex: 1 1 50%; min-width: 320px; overflow-y: auto; background: var(--cream-100); }
.review-inner { padding: 22px 24px 60px; }

/* the stat block — compact and horizontal, not a tall hero */
.statblock { display: flex; align-items: center; gap: 14px; }
.stat-num { font-family: var(--font-display); font-size: 2.75rem; line-height: 1; }
.stat-num.warn { color: var(--gold-600, #8a5a00); }
.stat-num.good { color: var(--success-700, #1A7546); }
.stat-label { font-size: 0.875rem; line-height: 1.35; color: var(--ink-900); }
.stat-label strong { display: block; font-family: var(--font-heading); font-weight: 800; color: var(--navy-900); font-size: 0.8125rem; }
.statbar-wrap { margin-top: 12px; }
.statbar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--cream-100); }
.statbar .seg-warn { background: var(--gold-500); }
.statbar .seg-good { background: var(--success-600, #2f9e5c); }
.statbar-scale { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.6875rem; color: var(--ink-500); }

.review-pane .notice { margin-top: 16px; }

.d-notes-head { font-family: var(--font-heading); font-weight: 800; font-size: 0.6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); margin: 22px 0 8px; }
.d-notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.d-note { padding: 13px 14px; border-radius: var(--radius-sm); background: var(--white); }
.d-note.done { background: transparent; box-shadow: inset 0 0 0 1.5px var(--cream-300); }
.d-note.done .d-note-text { color: var(--ink-500); }
.d-note-text { font-size: 0.875rem; line-height: 1.5; color: var(--ink-900); margin: 0; white-space: pre-wrap; }
.d-note-meta { font-family: var(--font-heading); font-weight: 700; font-size: 0.75rem; color: var(--ink-500); margin: 6px 0 0; }
.d-note-act { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.said { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-heading); font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: var(--success-700, #1A7546); }
.no-notes { margin-top: 20px; color: var(--ink-500); font-size: 0.875rem; }
.back-btn { display: none; }

/* ---- mobile: one column at a time, same left-to-right order stacked ---- */
@media (max-width: 1023px) {
  .nav-pane { width: 100%; border-right: 0; }
  body[data-view="detail"] .nav-pane { display: none; }
  body[data-view="list"] .workspace { display: none; }
  .workspace { flex-direction: column; overflow-y: auto; }
  .doc-pane, .review-pane { border-right: 0; overflow-y: visible; flex: none; min-width: 0; }
  .review-pane { border-top: 1px solid var(--cream-300); }
  .doc-inner, .review-inner { max-width: none; padding: 18px 18px 24px; }
  .back-btn { display: inline-flex; margin: 14px 18px 0; }
}
</style>
</head>
<body data-view="list">
<div class="lab-banner">PROTOTYPE V3 — fixture data, not wired to Firestore. Left-to-right: navigator → document → stats + comments.</div>
<div class="shell">
  <header class="topbar">
    <div>
      <p class="topbar-kicker">Reader feedback</p>
      <h1 class="topbar-title">2026 TA Vote Guide</h1>
    </div>
    <button class="btn quiet sm">Sign out</button>
  </header>
  <div class="panes">
    <nav class="nav-pane">
      <div class="nav-head">
        <div class="seg" id="seg"></div>
        <div class="sectionpick"><select id="sectionSelect"></select></div>
      </div>
      <div class="nav-scroll" id="listScroll"></div>
    </nav>
    <div class="workspace" id="workspace"></div>
  </div>
</div>

<script>
const TOPICS = ['Your Paycheck', 'Reserve Life', 'Uniforms & Commuting Costs'];

const CARDS = [
  {
    block: 'pay-progression', topic: 'Your Paycheck',
    title: 'A flatter pay ladder - seniority now earns you far less, locked in permanently',
    today: 'Seniority raises compound over your career under the current scale.',
    proposed: 'A flatter table — later years earn substantially less per step than today.',
    plain: "This sets your raise size for every year after year one, permanently. The steps get smaller the longer you stay, which is the opposite of how the current ladder works.",
    clear: 2, unclear: 4, burst: 0,
    notes: [
      { id: 'n1', text: "I've read this four times and I still can't tell if I'm better off. I'm a year 8 — the table shows the new rates but not what I'd have made on the old ladder, so there's nothing to compare against.", base: 'CLT', done: false },
      { id: 'n2', text: 'The word "flatter" is doing a lot of work here. Flatter than what? Say the actual number.', base: 'PHL', done: false },
      { id: 'n3', text: 'Locked in permanently is buried at the end. That should be the headline.', base: '', done: false },
    ],
  },
  {
    block: 'pay-retro', topic: 'Your Paycheck',
    title: 'Back-pay for the freeze years (retro pay)',
    today: 'No back-pay — the freeze years are simply gone.',
    proposed: 'A lump sum covering the gap between frozen and market rates since 2023.',
    plain: 'You get a one-time payment for the years your pay was frozen while prices rose. It lands as a lump sum, not spread across future checks.',
    clear: 2, unclear: 2, burst: 0,
    notes: [
      { id: 'n4', text: 'Is the retro taxed as a bonus? Everyone in the crew room is arguing about this.', base: 'CLT', done: true },
      { id: 'n5', text: "Doesn't say when it actually hits our checks.", base: '', done: false },
    ],
  },
  {
    block: 'pay-deadhead', topic: 'Your Paycheck',
    title: 'Deadhead pay', today: 'Paid at a reduced rate versus a working leg.', proposed: 'Paid at the same rate as a working leg.',
    plain: 'Deadhead pay moves to match your normal rate instead of a reduced one.',
    clear: 2, unclear: 10, burst: 1,
    notes: [{ id: 'n6', text: 'this is wrong', base: '', done: false }],
  },
  { block: 'pay-boarding', topic: 'Your Paycheck', title: 'Boarding pay', today: 'A flat rate per boarding.', proposed: 'A slightly higher flat rate.', plain: 'Boarding pay increases by a fixed amount per boarding.', clear: 3, unclear: 0, burst: 0, notes: [] },
  { block: 'pay-minday', topic: 'Your Paycheck', title: 'Minimum day pay', today: 'A floor below market.', proposed: 'A higher floor, closer to market.', plain: 'The minimum guaranteed pay for a short day goes up.', clear: 1, unclear: 0, burst: 0, notes: [
    { id: 'n7', text: 'Clear, but it would help to show this next to the current minimum day.', base: 'PHX', done: false },
  ] },
  { block: 'pay-levelset', topic: 'Your Paycheck', title: 'Day-one pay level (the +10%)', today: 'Rates frozen since 2023.', proposed: '+10% at ratification.', plain: 'You get a 10% raise the day this signs — mostly catching pay back up to where it was.', clear: 14, unclear: 0, burst: 0, notes: [] },
  { block: 'pay-wagepath', topic: 'Your Paycheck', title: 'Your yearly raises after 2027', today: 'No defined path.', proposed: '+1.5% per year, then a freeze.', plain: 'Raises are set at 1.5% a year for a few years, then stop for the rest of the contract.', clear: 9, unclear: 0, burst: 0, notes: [] },

  { block: 'res-hrv', topic: 'Reserve Life', title: 'Ready Reserve (HRV) limit',
    today: 'Capped lower than peers.', proposed: 'Raised, still below the top of the peer range.',
    plain: 'The cap on reserve days goes up, but not to the top of what comparable carriers offer.',
    clear: 3, unclear: 3, burst: 0,
    notes: [{ id: 'n8', text: 'How does this interact with golden days? Not explained.', base: 'DCA', done: false }],
  },
  { block: 'res-golden', topic: 'Reserve Life', title: 'Golden Days (protected days off)', today: 'A fixed number per year.', proposed: 'More days, awarded earlier.', plain: 'You get more protected days off, and they get scheduled further in advance.', clear: 6, unclear: 0, burst: 0, notes: [] },
  { block: 'res-pickup', topic: 'Reserve Life', title: 'Picking up trips', today: 'First-come, manual.', proposed: 'A faster electronic pickup window.', plain: 'Picking up open trips moves to a faster electronic process.', clear: 4, unclear: 0, burst: 0, notes: [] },

  { block: 'uni-allowance', topic: 'Uniforms & Commuting Costs', title: 'Yearly uniform allowance',
    today: '$X per year, unchanged since 2018.', proposed: 'Raised and indexed going forward.',
    plain: 'The yearly allowance goes up and is tied to a formula so it moves with prices instead of staying flat again.',
    clear: 1, unclear: 1, burst: 0,
    notes: [
      { id: 'n9', text: 'This contradicts what the union summary says about the indexing formula.', base: '', done: false, stale: true },
    ],
  },
  { block: 'uni-shoes', topic: 'Uniforms & Commuting Costs', title: 'What the allowance covers', today: 'Shoes only.', proposed: 'Shoes plus outerwear.', plain: 'The allowance can now also be spent on outerwear, not just shoes.', clear: 5, unclear: 0, burst: 0, notes: [] },
];

const DRIFT = [
  { block: 'pay-obsolete-card', note: 'The example in here uses 2024 rates.' },
];

let railSection = 'all';
let filter = 'attention'; // 'attention' | 'all'
let selected = null; // block id, 'drift', or null

function outstanding(card) {
  return card.unclear > 0 || card.notes.some((n) => !n.done);
}
function cardsFor(sec) {
  return sec === 'all' ? CARDS : CARDS.filter((c) => c.topic === sec);
}
function outstandingCount(sec) {
  return cardsFor(sec).filter(outstanding).length;
}

function renderNavHead() {
  const attnCount = outstandingCount(railSection);
  const allCount = cardsFor(railSection).length;
  const seg = document.getElementById('seg');
  seg.innerHTML = `
    <button aria-pressed="${filter === 'attention'}" data-filter="attention">Needs attention${attnCount ? ` (${attnCount})` : ''}</button>
    <button aria-pressed="${filter === 'all'}" data-filter="all">All (${allCount})</button>`;
  seg.querySelectorAll('button').forEach((b) => b.onclick = () => { filter = b.dataset.filter; draw(); });

  const items = [{ key: 'all', label: 'All sections' }, ...TOPICS.map((t) => ({ key: t, label: t }))];
  const select = document.getElementById('sectionSelect');
  select.innerHTML = items
    .map(({ key, label }) => {
      const n = outstandingCount(key);
      return `<option value="${key}"${railSection === key ? ' selected' : ''}>${label}${n ? ` (${n})` : ''}</option>`;
    })
    .join('');
  select.onchange = () => { railSection = select.value; draw(); };
}

function rowBadges(card) {
  const badges = [];
  if (card.unclear > 0) badges.push(`<span class="stat-pill warn">${card.unclear} unclear</span>`);
  const open = card.notes.filter((n) => !n.done).length;
  if (open) badges.push(`<span class="stat-pill warn">${open} note${open === 1 ? '' : 's'}</span>`);
  if (card.clear > 0) badges.push(`<span class="stat-pill ${card.unclear === 0 ? 'good' : 'quiet'}">${card.clear} clear</span>`);
  return badges.join('');
}

function renderList() {
  const scroll = document.getElementById('listScroll');
  let cards = cardsFor(railSection);
  if (filter === 'attention') cards = cards.filter(outstanding);

  if (!cards.length && filter === 'attention') {
    scroll.innerHTML = `<div class="empty-list">Nothing needs attention here.<br>Switch to "All" to browse every card.</div>`;
    return;
  }

  const groupBy = railSection === 'all';
  let html = '';
  let lastTopic = null;
  for (const card of cards) {
    if (groupBy && card.topic !== lastTopic) {
      html += `<p class="group-head">${card.topic}</p>`;
      lastTopic = card.topic;
    }
    const settled = !outstanding(card);
    html += `
      <button class="row${settled ? ' settled' : ''}" data-select="${card.block}" aria-current="${selected === card.block}">
        <div class="row-title">${card.title}</div>
        <div class="row-badges">${rowBadges(card)}</div>
      </button>`;
  }

  if (railSection === 'all' && filter === 'all' && DRIFT.length) {
    html += `<p class="group-head">Older content</p>
      <button class="row settled" data-select="drift" aria-current="${selected === 'drift'}">
        <div class="row-title">About text we've since rewritten</div>
        <div class="row-badges"><span class="stat-pill quiet">${DRIFT.length} response${DRIFT.length === 1 ? '' : 's'}</span></div>
      </button>`;
  }

  scroll.innerHTML = html;
  scroll.querySelectorAll('[data-select]').forEach((b) => b.onclick = () => {
    selected = b.dataset.select;
    document.body.dataset.view = 'detail';
    draw();
  });
}

function statBlock(card) {
  const answered = card.clear + card.unclear;
  if (answered === 0) return '';

  const allClear = card.unclear === 0;
  const headline = allClear
    ? `<div class="stat-num good">${card.clear}</div>
       <div class="stat-label"><strong>said this was clear</strong>${answered === 1 ? 'the one person who answered' : `all ${answered} responses`}</div>`
    : `<div class="stat-num warn">${card.unclear}</div>
       <div class="stat-label"><strong>of ${answered} said this wasn't clear</strong>${Math.round((card.unclear / answered) * 100)}% of responses</div>`;

  // The bar always renders, even at 100% one way — a card that's briefly all
  // clear keeps the same shape as one that isn't, instead of the layout
  // shifting depending on which state a card happens to be in.
  return `
    <div class="statblock">${headline}</div>
    <div class="statbar-wrap">
      <div class="statbar">
        ${card.unclear > 0 ? `<div class="seg-warn" style="flex:${card.unclear}"></div>` : ''}
        ${card.clear > 0 ? `<div class="seg-good" style="flex:${card.clear}"></div>` : ''}
      </div>
      <div class="statbar-scale"><span>${card.unclear} unclear</span><span>${card.clear} clear</span></div>
    </div>`;
}

function noteRow(note) {
  const tags = [note.base, note.stale ? 'written about an older version of this card' : null].filter(Boolean).join(' · ');
  return `
    <li class="d-note${note.done ? ' done' : ''}">
      <p class="d-note-text">${note.text}</p>
      ${tags ? `<p class="d-note-meta">${tags}</p>` : ''}
      <div class="d-note-act">
        ${note.done
          ? `<span class="said">✓ Done</span><button class="link" data-toggle="${note.id}">Undo</button>`
          : `<button class="btn quiet sm" data-toggle="${note.id}">Done</button>`}
      </div>
    </li>`;
}

function renderWorkspace() {
  const ws = document.getElementById('workspace');

  if (selected === 'drift') {
    ws.innerHTML = `
      <div class="doc-pane"><div class="doc-inner">
        <button class="btn quiet sm back-btn" id="back">← Back</button>
        <h2 class="d-title">About text we've since rewritten</h2>
        <p class="d-topic">Feedback about cards no longer in the guide</p>
        <p style="margin-top:14px; color:var(--ink-500); font-size:0.875rem;">Read these against the old wording, not the current one.</p>
      </div></div>
      <div class="review-pane"><div class="review-inner">
        <p class="d-notes-head">Notes</p>
        <ul class="d-notes">${DRIFT.map((d) => `<li class="d-note"><p class="d-note-text">${d.note}</p><p class="d-note-meta">${d.block}</p></li>`).join('')}</ul>
      </div></div>`;
    ws.querySelector('#back')?.addEventListener('click', () => { document.body.dataset.view = 'list'; });
    return;
  }

  const card = CARDS.find((c) => c.block === selected);
  if (!card) {
    ws.innerHTML = `<div class="workspace-empty">Select a card on the left to read it and see what people said.</div>`;
    return;
  }

  const openNotes = card.notes.filter((n) => !n.done);
  ws.innerHTML = `
    <div class="doc-pane"><div class="doc-inner">
      <button class="btn quiet sm back-btn" id="back">← Back</button>
      <h2 class="d-title">${card.title}</h2>
      <p class="d-topic">${card.topic}</p>
      ${card.plain ? `
        <div class="d-body">
          ${card.today || card.proposed ? `
          <div class="d-tp">
            <div><p class="d-tp-label today">Today</p><p>${card.today}</p></div>
            <div><p class="d-tp-label proposed">Proposed</p><p>${card.proposed}</p></div>
          </div>` : ''}
          <p class="d-plain">${card.plain}</p>
        </div>` : ''}
    </div></div>
    <div class="review-pane"><div class="review-inner">
      ${statBlock(card)}
      ${card.burst ? `<div class="notice"><span>⚠</span><p class="nt">These all arrived within ten minutes of each other. Treat this ranking as unverified.</p></div>` : ''}
      ${card.notes.length ? `
        <p class="d-notes-head">Notes</p>
        <ul class="d-notes">${card.notes.map(noteRow).join('')}</ul>
        ${openNotes.length > 1 ? `<button class="link" data-allDone="${card.block}" style="margin-top:10px;">Mark all ${openNotes.length} done</button>` : ''}
      ` : `<p class="no-notes">No notes — nothing else to review here.</p>`}
    </div></div>`;

  ws.querySelector('#back')?.addEventListener('click', () => { document.body.dataset.view = 'list'; });
  ws.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => {
    const id = b.dataset.toggle;
    for (const c of CARDS) { const n = c.notes.find((x) => x.id === id); if (n) n.done = !n.done; }
    draw();
  });
  ws.querySelector('[data-allDone]')?.addEventListener('click', (e) => {
    const c = CARDS.find((x) => x.block === e.currentTarget.dataset.alldone);
    c.notes.forEach((n) => { n.done = true; });
    draw();
  });
}

function draw() {
  renderNavHead();
  renderList();
  renderWorkspace();
}

draw();
</script>
</body>
</html>
