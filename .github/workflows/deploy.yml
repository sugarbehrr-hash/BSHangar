# Build the Astro site and publish it to GitHub Pages.
#
# This IS the live deploy. The repo's Pages source is set to "GitHub Actions"
# (`build_type: workflow` on the Pages API), so every push to main runs this and
# publishes `dist` to bluestreakhangar.com — nothing else serves the site, and
# main's root is no longer read directly.
#
# What that means in practice: anything the build generates rather than commits
# ships from here and only from here. The vote guide's feedback bundle is the
# one to remember — public/contract/_assets/guide-feedback*.js is gitignored and
# rebuilt by `npm run build`, so a change to src/guide/feedback reaches readers
# through this workflow, not through the file in the tree.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a running publish — a half-finished
# Pages deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs `astro build` then `pagefind --site dist`, so the search index is
      # built from the rendered HTML and can never drift from the page copy.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
